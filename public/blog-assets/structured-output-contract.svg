<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="196" y1="88" x2="1367" y2="877" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13131A"/>
      <stop offset="1" stop-color="#09090D"/>
    </linearGradient>
    <linearGradient id="ember" x1="291" y1="260" x2="1322" y2="655" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9B61"/>
      <stop offset="1" stop-color="#E8743B"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEF1F4"/>
      <stop offset="1" stop-color="#AEB7C2"/>
    </linearGradient>
    <filter id="shadow" x="160" y="122" width="1280" height="580" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1600" height="920" rx="36" fill="url(#bg)"/>
  <circle cx="1288" cy="148" r="216" fill="#E8743B" fill-opacity="0.12"/>
  <circle cx="266" cy="764" r="264" fill="#6BA6FF" fill-opacity="0.06"/>

  <text x="196" y="124" fill="#E8743B" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="0.16em">HITARTH DESAI AI ENGINEER</text>
  <text x="196" y="182" fill="#F3F5F7" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="700">Deterministic Structured Output Pipeline</text>
  <text x="196" y="224" fill="#AAB4BE" font-family="'Inter', sans-serif" font-size="28">Constrain generation. Validate hard. Surface failure. Only then trust downstream automation.</text>

  <g filter="url(#shadow)">
    <rect x="196" y="278" width="244" height="228" rx="28" fill="#11141A" stroke="#232C35" stroke-width="2"/>
    <rect x="490" y="278" width="244" height="228" rx="28" fill="#11141A" stroke="#232C35" stroke-width="2"/>
    <rect x="784" y="278" width="244" height="228" rx="28" fill="#11141A" stroke="#232C35" stroke-width="2"/>
    <rect x="1078" y="278" width="244" height="228" rx="28" fill="#11141A" stroke="#232C35" stroke-width="2"/>
  </g>

  <path d="M440 392H490" stroke="url(#ember)" stroke-width="10" stroke-linecap="round"/>
  <path d="M734 392H784" stroke="url(#ember)" stroke-width="10" stroke-linecap="round"/>
  <path d="M1028 392H1078" stroke="url(#ember)" stroke-width="10" stroke-linecap="round"/>

  <circle cx="465" cy="392" r="8" fill="#FFB083"/>
  <circle cx="759" cy="392" r="8" fill="#FFB083"/>
  <circle cx="1053" cy="392" r="8" fill="#FFB083"/>

  <text x="232" y="340" fill="#FF9B61" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="0.18em">01 INPUT</text>
  <text x="232" y="390" fill="#F3F5F7" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700">Document</text>
  <text x="232" y="430" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">OCR text, PDFs, emails,</text>
  <text x="232" y="463" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">or scraped pages enter</text>
  <text x="232" y="496" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">the extraction system.</text>

  <text x="526" y="340" fill="#FF9B61" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="0.18em">02 GENERATION</text>
  <text x="526" y="390" fill="#F3F5F7" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700">Constrain</text>
  <text x="526" y="430" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">Schema-aware decoding,</text>
  <text x="526" y="463" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">tool calling, or grammar</text>
  <text x="526" y="496" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">rules shape the output.</text>

  <text x="820" y="340" fill="#FF9B61" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="0.18em">03 VALIDATION</text>
  <text x="820" y="390" fill="#F3F5F7" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700">Validate</text>
  <text x="820" y="430" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">Typed schemas, enums,</text>
  <text x="820" y="463" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">ranges, and invariants</text>
  <text x="820" y="496" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">decide what is trusted.</text>

  <text x="1114" y="340" fill="#FF9B61" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="0.18em">04 SYSTEM</text>
  <text x="1114" y="390" fill="#F3F5F7" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700">Operate</text>
  <text x="1114" y="430" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">Retries, dead-lettering,</text>
  <text x="1114" y="463" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">metrics, and typed</text>
  <text x="1114" y="496" fill="#D5DCE3" font-family="'Inter', sans-serif" font-size="24">handoffs keep it stable.</text>

  <path d="M240 620H1280" stroke="#232C35" stroke-width="2"/>
  <text x="240" y="678" fill="#DCE1E7" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">Trusted downstream outcomes</text>
  <text x="240" y="718" fill="#9DA8B3" font-family="'Inter', sans-serif" font-size="24">database writes • scoring systems • workflows • customer-facing automations</text>

  <rect x="240" y="758" width="312" height="62" rx="31" fill="#0E1217" stroke="#253140" stroke-width="2"/>
  <text x="282" y="797" fill="url(#steel)" font-family="'JetBrains Mono', monospace" font-size="21">schema-constrained output</text>

  <rect x="576" y="758" width="226" height="62" rx="31" fill="#0E1217" stroke="#253140" stroke-width="2"/>
  <text x="629" y="797" fill="url(#steel)" font-family="'JetBrains Mono', monospace" font-size="21">strict validation</text>

  <rect x="826" y="758" width="242" height="62" rx="31" fill="#0E1217" stroke="#253140" stroke-width="2"/>
  <text x="870" y="797" fill="url(#steel)" font-family="'JetBrains Mono', monospace" font-size="21">observable pipelines</text>

  <rect x="1092" y="758" width="238" height="62" rx="31" fill="#0E1217" stroke="#253140" stroke-width="2"/>
  <text x="1150" y="797" fill="url(#steel)" font-family="'JetBrains Mono', monospace" font-size="21">bounded retries</text>
</svg>
