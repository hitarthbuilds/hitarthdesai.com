<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Progressive-enhancement flag: set BEFORE first paint so the no-JS CSS
         fallback (index.css) keeps revealed content visible when JS never runs. -->
    <script>
      document.documentElement.classList.add('js');
    </script>

    <meta name="author" content="Hitarth Desai" />

    <!-- Per-page <title>, description, canonical, Open Graph and Twitter tags are
         set per route via the <Head> component (see src/pages/*). The site-wide
         Person identity below stays global. -->

    <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD Person — the entity / Knowledge-Graph anchor. Static, site-wide. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://hitarthdesai.com/#person",
      "name": "Hitarth Desai",
      "givenName": "Hitarth",
      "familyName": "Desai",
      "jobTitle": "AI Engineer",
      "description": "Hitarth Desai AI Engineer specializing in LLM data extraction pipelines, MLOps infrastructure, and deterministic structured-output tooling.",
      "url": "https://hitarthdesai.com/",
      "image": "https://hitarthdesai.com/og.svg",
      "worksFor": {
        "@type": "Organization",
        "name": "InfraDock AI"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Gujarat Technological University"
      },
      "homeLocation": {
        "@type": "Place",
        "address": { "@type": "PostalAddress", "addressLocality": "Surat", "addressRegion": "Gujarat", "addressCountry": "IN" }
      },
      "knowsAbout": [
        "AI Systems Engineering",
        "MLOps Infrastructure",
        "LLM Data Extraction Pipelines",
        "Structured Output / Constrained Decoding",
        "Document Processing Pipelines",
        "Distributed Systems",
        "Microservices Architecture",
        "Python",
        "Multi-Agent Systems"
      ],
      "sameAs": [
        "https://github.com/hitarthbuilds",
        "https://huggingface.co/hitarthbuilds",
        "https://www.linkedin.com/in/hitarth-desai10",
        "https://x.com/hitarthbuilds",
        "https://pypi.org/user/hitarth_builds_10/"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
